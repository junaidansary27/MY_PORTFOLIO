<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background glow for dark mode -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="sz-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" /> <!-- Blue 500 -->
      <stop offset="50%" stop-color="#06b6d4" /> <!-- Cyan 500 -->
      <stop offset="100%" stop-color="#10b981" /> <!-- Emerald 500 -->
    </linearGradient>
  </defs>

  <!-- Geometric Hexagonal Frame -->
  <polygon points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5" fill="none" stroke="url(#sz-gradient)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Monogram SZ Shape -->
  <path d="M 65 32 L 42 32 L 32 44 L 42 54 L 58 54 L 35 74 L 65 74" 
        fill="none" 
        stroke="url(#sz-gradient)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- AI Connection Nodes / Vertices -->
  <circle cx="65" cy="32" r="3" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
  <circle cx="32" cy="44" r="3" fill="#ffffff" stroke="#06b6d4" stroke-width="1.5" />
  <circle cx="58" cy="54" r="3" fill="#ffffff" stroke="#06b6d4" stroke-width="1.5" />
  <circle cx="35" cy="74" r="3" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
  <circle cx="65" cy="74" r="3" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
</svg>
